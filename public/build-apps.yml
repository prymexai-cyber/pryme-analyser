# Builds the Pryme Quant apps for free on GitHub:
#   • Android  → PrymeQuant.apk (+ assetlinks.json)
#   • Windows  → PrymeQuant-Setup.exe
# How: GitHub → Actions → "Build Pryme Quant apps" → Run workflow. Downloads appear under "Artifacts".
name: Build Pryme Quant apps

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Your Pryme Quant website (Render URL)"
        required: true
        default: "https://pryme-analyser.onrender.com"

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      SITE: ${{ github.event.inputs.site_url }}
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Wake up the website (Render free plan sleeps)
        run: for i in 1 2 3 4 5 6; do curl -fsS -o /dev/null "$SITE/manifest.json" && break || sleep 15; done
      - name: Signing key
        run: |
          PW="${KS_PASS:-prymequant123}"
          echo "PW=$PW" >> $GITHUB_ENV
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android.keystore
            echo "NEW_KEY=no" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore android.keystore -alias prymequant -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PW" -keypass "$PW" -dname "CN=Pryme Quant, O=Pryme Quant, C=LK"
            echo "NEW_KEY=yes" >> $GITHUB_ENV
          fi
      - name: Create Android project
        run: |
          cd apps/android
          npm init -y >/dev/null
          npm install @bubblewrap/core@1.24.1
          node generate.js "$SITE" ../../twa
      - name: Build APK
        run: |
          cd twa
          chmod +x gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          ./gradlew assembleRelease --no-daemon
      - name: Sign APK + make assetlinks.json
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 twa/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks android.keystore --ks-key-alias prymequant --ks-pass pass:$PW --key-pass pass:$PW --out PrymeQuant.apk aligned.apk
          FP=$(keytool -list -v -keystore android.keystore -alias prymequant -storepass "$PW" | grep -m1 'SHA256:' | awk '{print $2}')
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.prymequant.app","sha256_cert_fingerprints":["%s"]}}]\n' "$FP" > assetlinks.json
          mkdir -p out && cp PrymeQuant.apk assetlinks.json out/
          if [ "$NEW_KEY" = "yes" ]; then base64 -w0 android.keystore > out/KEEP-SECRET-android-keystore-base64.txt; fi
          {
            echo "## ✅ Android app ready"
            echo "1. Download **PrymeQuant-Android** below and install **PrymeQuant.apk** on your phone."
            echo "2. Render → Environment → add **ASSETLINKS_JSON** with this value (removes the browser bar):"
            echo '```'; cat assetlinks.json; echo '```'
            if [ "$NEW_KEY" = "yes" ]; then echo "3. Optional: to keep the same app signature for updates, add GitHub secret **ANDROID_KEYSTORE_BASE64** = contents of KEEP-SECRET-android-keystore-base64.txt (password: prymequant123)."; fi
          } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: PrymeQuant-Android
          path: out/

  windows:
    runs-on: windows-latest
    env:
      SITE: ${{ github.event.inputs.site_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Windows installer
        shell: bash
        run: |
          cd apps/windows
          cp ../../public/icon-512.png icon.png
          printf '{"url":"%s"}' "$SITE" > config.json
          npm install
          npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: PrymeQuant-Windows
          path: apps/windows/dist/*.exe
